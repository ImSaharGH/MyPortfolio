{% load static %}

<!DOCTYPE html>
<html lang="zxx">

<head>

    <!-- Metas -->
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <meta name="keywords" content="HTML5 Template Personala onepage themeforest" />
    <meta name="description" content="Personala - Onepage Multi-Purpose HTML5 Template" />
    <meta name="author" content="His7am" />

    <!-- Title  -->
    <title>Portfolio</title>

    <!-- Favicon -->
    <link rel="shortcut icon" href="{% static 'img/favicon.ico' %}" />

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,500,600,700,800" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css?family=Josefin+Sans:100i,300,400,600,700" rel="stylesheet">

    <!-- Plugins -->
    <link rel="stylesheet" href="{% static 'css/plugins.css' %}" />

    <!-- Core Style Css -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />

</head>

<body class="dark-theme">

    <!-- =====================================
    	==== Start Loading -->
    <div class="loading">
        <div class="text-center middle">
            <div class="lds-ellipsis">
                <div></div>
                <div></div>
                <div></div>
                <div></div>
            </div>
        </div>
    </div>
    <!-- End Loading ====
    	======================================= -->


    <!-- =====================================
    	==== Start Navbar -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">

            <!-- Logo -->
            <a class="logo" href="">Portfolio</a>

            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="icon-bar"><i class="fas fa-bars"></i></span>
            </button>

            <!-- navbar links -->
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="#" data-scroll-nav="0">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" data-scroll-nav="1">About</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" data-scroll-nav="2">Services</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" data-scroll-nav="3">Portfolio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" data-scroll-nav="4">Testimonials</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" data-scroll-nav="5">Blog</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" data-scroll-nav="6">Contact</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <!-- End Navbar ====
    	======================================= -->


    <!-- =====================================
    	==== Start Header -->
    <header class="header valign bg-img" data-scroll-index="0" data-overlay-dark="5" data-background="{% static 'img/bg1.jpg' %}"
        data-stellar-background-ratio="0.5">
        <div class="container">
            <div class="row">
                <div class="vertical-center full-width text-center caption">
                    <h2>I Love To Develope</h2>
                    <h1 class="cd-headline clip">
                        <span class="blc">I Am </span>
                        <span class="cd-words-wrapper">
                            <b class="is-visible">Sahar Salehi</b>
                            <b>a Developer</b>
                            <b>a Programmer</b>
                        </span>
                    </h1>
                </div>
            </div>
        </div>

        <div class="arrow">
            <a href="#" data-scroll-nav="1">
                <i class="fas fa-chevron-down"></i>
            </a>
        </div>
    </header>
    <!-- End Header ====
    	======================================= -->

    {% block content %}

    {% endblock %}

    <!-- =====================================
    	==== Start Footer -->
    <footer class="footer">
        <p>Copyright &copy; And Made With Love All Rights Reserved.</p>
    </footer>
    <!-- End Footer ====
    	======================================= -->





    <!-- jQuery -->
    <script src="{% static 'js/jquery-3.0.0.min.js' %}"></script>
    <script src="{% static 'js/jquery-migrate-3.0.0.min.js' %}"></script>

    <!-- popper.min -->
    <script src="{% static 'js/popper.min.js' %}"></script>

    <!-- bootstrap -->
    <script src="{% static 'js/bootstrap.min.js' %}"></script>

    <!-- scrollIt -->
    <script src="{% static 'js/scrollIt.min.js' %}"></script>

    <!-- animated.headline -->
    <script src="{% static 'js/animated.headline.js' %}"></script>

    <!-- jquery.waypoints.min -->
    <script src="{% static 'js/jquery.waypoints.min.js' %}"></script>

    <!-- jquery.counterup.min -->
    <script src="{% static 'js/jquery.counterup.min.js' %}"></script>

    <!-- owl carousel -->
    <script src="{% static 'js/owl.carousel.min.js' %}"></script>

    <!-- jquery.magnific-popup js -->
    <script src="{% static 'js/jquery.magnific-popup.min.js' %}"></script>

    <!-- stellar js -->
    <script src="{% static 'js/jquery.stellar.min.js' %}"></script>

    <!-- isotope.pkgd.min js -->
    <script src="{% static 'js/isotope.pkgd.min.js' %}"></script>

    <!-- validator js -->
    <script src="{% static 'js/validator.js' %}"></script>

    <!-- custom scripts -->
    <script src="{% static 'js/scripts.js' %}"></script>

</body>

</html>
